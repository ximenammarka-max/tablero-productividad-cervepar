<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cervepar — Productividad de Campo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/mosk">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --navy:#191717;--navy2:#2b2626;--navy3:#3a3434;--navy-soft:#eaf5f3;
  --gold:#3CB3A8;--gold-soft:#eaf5f3;--brand-red:#C11D2A;--brand-red-soft:#fbe9ea;
  --bg:#f3f4f8;--card:#ffffff;--bd:#e9ebf2;--bd2:#dde1eb;
  --tx:#1b2033;--tx2:#616984;--tx3:#9aa1b8;
  --ok:#2f9188;--ok-bg:#e9f7f5;--er:#C11D2A;--er-bg:#fbe9ea;--wa:#c6862f;--wa-bg:#fbf1e1;
  --r:20px;--r2:12px;--r3:8px;--sw:246px;--hh:66px;--fh:58px;
  --sh:0 14px 36px rgba(15,25,55,.10);--sh2:0 3px 14px rgba(15,25,55,.055);--sh3:0 1px 3px rgba(15,25,55,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Mosk','Outfit',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#ced3e0;border-radius:4px}
button,input,select{font-family:'Mosk','Outfit',sans-serif}
.app{display:flex;height:100vh;width:100vw;overflow:hidden}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;z-index:10}
.sb-brand{padding:32px 26px 24px}
.sb-logo{display:flex;align-items:center;gap:13px}
.sb-ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(150deg,var(--navy2),var(--navy) 65%);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:.5px;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(14,31,66,.28)}
.sb-name{font-size:16px;font-weight:700;letter-spacing:-.1px;color:var(--navy)}
.sb-tag{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.4px;margin-top:4px;font-weight:600}
.sb-nav{padding:6px 20px;flex:1}
.ni{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r3);color:var(--tx2);font-size:12.5px;font-weight:500;cursor:pointer;margin-bottom:4px;transition:.18s ease;letter-spacing:.1px}
.ni i{width:15px;text-align:center;font-size:12px;color:var(--tx3);transition:.18s ease}
.ni:hover{background:var(--navy-soft);color:var(--navy)}
.ni:hover i{color:var(--navy2)}
.ni.active{background:linear-gradient(135deg,var(--navy2),var(--navy) 120%);color:#fff;font-weight:600;box-shadow:0 8px 18px rgba(14,31,66,.22)}
.ni.active i{color:#fff}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--hh);background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 40px;flex-shrink:0}
.tb-title{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.tb-sub{font-size:11.5px;color:var(--tx3);margin-top:2px;letter-spacing:.1px}
.filterbar{min-height:var(--fh);background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:flex-end;gap:22px;padding:11px 40px;flex-wrap:wrap;flex-shrink:0}
.fgroup{display:flex;flex-direction:column;gap:5px}
.fgroup .fl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700;display:flex;align-items:center;gap:5px}
.fgroup .fl i{font-size:9.5px;color:var(--navy3)}
.filterbar select{padding:7px 13px;background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r3);color:var(--tx);font-size:12px;outline:none;cursor:pointer;transition:.15s ease;min-width:150px}
.filterbar select:hover{border-color:var(--navy3)}
.filterbar select:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(60,179,168,.18)}
.fdiv{width:1px;align-self:stretch;background:var(--bd);margin:0 2px}
.chip-clear{margin-left:auto;align-self:center;font-size:11px;color:var(--navy2);font-weight:600;cursor:pointer;padding:9px 18px;border-radius:20px;background:var(--navy-soft);transition:.15s ease;white-space:nowrap}
.chip-clear:hover{background:#d8ece8}
.content{flex:1;overflow-y:auto;padding:36px 42px 48px}
.content>*+*{margin-top:30px}
.page{display:none;flex-direction:column;gap:30px}
.page.active{display:flex}

.sect-hdr{display:flex;justify-content:center;margin:4px 0 2px}
.sect-pill{background:linear-gradient(135deg,var(--navy2),var(--navy) 130%);color:#fff;font-weight:600;font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;padding:13px 44px;border-radius:40px;box-shadow:0 10px 26px rgba(14,31,66,.20)}
.dashed-group{border:1.5px dashed #c7cddc;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:18px;background:rgba(255,255,255,.4);height:100%}
.grid-2{display:grid;gap:22px}
.grid-2.stretch{align-items:stretch}
.grid-2 .col{display:flex;flex-direction:column;gap:14px}
.grid-2 .col>.card{flex:1;display:flex;flex-direction:column}
.grid-2 .col>.card .chart-h-lg{flex:1}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
.kpi-box{border-radius:var(--r2);padding:26px 20px;text-align:center;box-shadow:var(--sh2);position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.kpi-box:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi-box::after{content:'';position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.10),transparent 55%)}
.kpi-box.g{background:linear-gradient(150deg,#3CB3A8,#2f8f86)}
.kpi-box.n{background:linear-gradient(150deg,var(--navy3),var(--navy) 120%)}
.kpi-box .v{font-size:30px;font-weight:700;color:#fff;line-height:1;letter-spacing:-.4px;font-variant-numeric:tabular-nums;position:relative}
.kpi-box .l{font-size:10px;font-weight:600;color:rgba(255,255,255,.78);text-transform:uppercase;letter-spacing:1px;margin-top:11px;position:relative}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh2);border:1px solid var(--bd)}
.card-p{padding:28px 30px}
.card-title{font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:1.1px;text-align:center;margin-bottom:20px}
.chart-h{position:relative;height:230px}
.chart-h-lg{position:relative;height:300px}

.tw{background:var(--card);border-radius:var(--r);box-shadow:var(--sh2);border:1px solid var(--bd);overflow:hidden}
.tw-title{background:linear-gradient(135deg,var(--navy2),var(--navy) 130%);color:#fff;text-align:center;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.1px;padding:14px}
table{width:100%;border-collapse:collapse}
th{padding:13px 18px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.92);background:var(--navy2);text-transform:uppercase;letter-spacing:.7px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;transition:.15s ease}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th:hover{background:var(--navy3)}
th .sort-ico{font-size:8px;margin-left:5px;opacity:.6}
td{padding:12px 18px;font-size:12.5px;border-bottom:1px solid var(--bd);color:var(--tx)}
tbody tr{transition:background .12s ease}
tbody tr:nth-child(even){background:#f8f9fc}
tbody tr:hover{background:var(--navy-soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--navy2);background:#fff!important;color:var(--navy)}
.heat-wrap{overflow:auto;max-height:64vh;position:relative}
.heat-wrap table{border-collapse:separate;border-spacing:0}
.heat-wrap th{position:sticky;top:0;z-index:2}
.heat-wrap th:first-child{left:0;z-index:3;text-align:left}
.heat-wrap td:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:2px 0 4px rgba(15,25,55,.04);border-right:1px solid var(--bd)}
.heat-wrap tbody tr:nth-child(even) td:first-child{background:#f8f9fc}
.heat-wrap tr.tot td:first-child{background:#fff}
.fbar{background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);padding:16px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--sh2)}
.fbar-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.fsel,.fsearch{padding:8px 14px;background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r3);color:var(--tx);font-size:12px;outline:none;transition:.15s ease}
.fsearch{min-width:230px}
.fsel:hover,.fsearch:hover{border-color:var(--navy3)}
.fsel:focus,.fsearch:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(60,179,168,.18)}
.pct-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;min-width:48px;text-align:center;letter-spacing:.2px}
.heat-name{color:#2f8f86;font-weight:600;white-space:nowrap}
.heat-cell{text-align:center;font-weight:600;font-size:10.5px;color:#fff;min-width:48px;border-radius:3px}
.badge-nuevo{background:var(--gold-soft);color:#2f8f86;font-size:9px;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:6px}
.eff-bar{flex:1;height:6px;background:#e9ecf3;border-radius:3px;overflow:hidden;min-width:50px}
.eff-fill{height:100%;border-radius:3px}
.empty-note{padding:56px 40px;text-align:center;color:var(--tx3);font-size:13px;letter-spacing:.1px}
.map-wrap{position:relative;height:62vh;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh2);border:1px solid var(--bd)}
#map-cobertura{height:100%;width:100%}
.map-legend{position:absolute;bottom:16px;left:16px;z-index:1000;background:rgba(255,255,255,.95);border-radius:var(--r3);padding:14px 18px;box-shadow:var(--sh);font-size:11.5px;min-width:170px}
.map-legend .lt{font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px}
.map-legend .li{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.map-legend .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.leaflet-popup-content-wrapper{border-radius:var(--r3);font-family:'Mosk','Outfit',sans-serif}
.leaflet-popup-content b{color:var(--navy)}
</style>
</head>

</div>
</div>

// Devuelve records filtrados. excludeDim permite ignorar una dimensión (ej: para el gráfico de meses no filtramos por mes)
function getRecords(excludeDim){
  const mesOk = excludeDim==='mes' || FILT.mes==='all';
  const zonaOk = excludeDim==='zona' || FILT.zona==='all';
  const regOk = excludeDim==='region' || FILT.region==='all';
  if(mesOk && zonaOk && regOk) return RECORDS;
  return RECORDS.filter(r=>{
    if(!mesOk && Math.floor(r[1]/100)!==parseInt(FILT.mes)) return false;
    if(!zonaOk && ZONA[r[4]]!==FILT.zona) return false;
    if(!regOk && REGION[r[3]]!==FILT.region) return false;
    return true;
  });
}

  if(FILT.region!=='all') parts.push('Región '+toTitle(FILT.region));
  return parts.length? parts.join(' · ') : 'Enero – Septiembre 2026 (todos los datos)';
}

// Helpers de agregación sobre records filtrados
// record = [colabIdx, mmdd, ciudadIdx, regionIdx, zonaIdx, fueraRuta, realizada]
// ═══════════════════════════════════════════════════════════
function aggBy(records, keyFn){
  const m = new Map();
  for(const r of records){
    const k = keyFn(r);
    if(!m.has(k)) m.set(k, {plan:0, real:0, fueraReal:0});
    const o = m.get(k);
    o.plan++;
    if(r[6]) o.real++;
    if(r[6] && r[5]) o.fueraReal++;
  }
  return m;
}

  ${totPlan===0 ? '<div class="empty-note">No hay datos para esta combinación de filtros.</div>' : `
  <div class="kpi-grid">
    <div class="kpi-box g"><div class="v">${num(totPlan)}</div><div class="l">Visitas ruteadas</div></div>
    <div class="kpi-box n"><div class="v">${num(totReal)}</div><div class="l">Visitas efectivas</div></div>
    <div class="kpi-box n"><div class="v">${pct0(effBruta)}</div><div class="l">Productividad</div></div>
    <div class="kpi-box g"><div class="v">${num(colabActivos)}</div><div class="l">Colaboradores de campo${(FILT.zona!=='all'||FILT.region!=='all')?' (con visitas registradas)':''}</div></div>
  </div>

  <div class="sect-hdr"><div class="sect-pill">Tendencia mensual</div></div>
  <div class="card card-p">
    <div class="chart-h-lg"><canvas id="ch-tendencia"></canvas></div>
  </div>

  <div class="grid-2 stretch" style="grid-template-columns:1fr 1.3fr">
    <div class="col">
      <div class="sect-hdr"><div class="sect-pill">Productividad zonas</div></div>
      <div class="dashed-group">
        ${zonaCards.length ? zonaCards.map(z=>z.html).join('') : '<div class="empty-note">Sin datos de zona para este filtro.</div>'}
      </div>
    </div>
    <div class="col">
      <div class="sect-hdr"><div class="sect-pill">Productividad por ciudad</div></div>
      <div class="card card-p">
        <div class="chart-h-lg"><canvas id="ch-ciudad"></canvas></div>
      </div>
    </div>
  </div>
  `}
  `;
  if(totPlan===0) return;

  mkC('ch-tendencia','bar',{
    labels: meses.map(m=>MES_NOMBRES[m].slice(0,3)),
    datasets:[
      {type:'bar',label:'Planificadas',data:meses.map(m=>byMes.get(m).plan),backgroundColor:'#cdd6e8',borderRadius:4,yAxisID:'y'},
      {type:'bar',label:'Realizadas',data:meses.map(m=>byMes.get(m).real),backgroundColor:'#0c1c3e',borderRadius:4,yAxisID:'y'},
      {type:'line',label:'Efectividad',data:meses.map(m=>byMes.get(m).real/byMes.get(m).plan*100),borderColor:'#1f9d55',backgroundColor:'#1f9d55',tension:.35,yAxisID:'y1',pointRadius:3},
    ]
  },{
    scales:{
      y:{position:'left',ticks:{color:tc()},grid:{color:tg()}},
      y1:{position:'right',min:0,max:100,ticks:{color:tc(),callback:v=>v+'%'},grid:{drawOnChartArea:false}},
      x:{ticks:{color:tc()},grid:{display:false}}
    },
    plugins:{legend:{labels:{color:tc(),boxWidth:12,font:{size:11}}}}
  });

  mkC('ch-ciudad','bar',{
    labels: ciuArr.map(c=>toTitle(c.ciudad)),
    datasets:[{data:ciuArr.map(c=>Math.round(c.eff*100)),backgroundColor:ciuArr.map((c,i)=>PALETTE[i%PALETTE.length]),borderRadius:3}]
  },{
    scales:{
      y:{min:0,max:100,ticks:{color:tc(),callback:v=>v+' %'},grid:{color:tg()},title:{display:true,text:'PRODUCTIVIDAD',color:tc(),font:{size:10,weight:700}}},
      x:{ticks:{color:tc(),font:{size:9.5},maxRotation:35,minRotation:35},grid:{display:false}}
    },
    plugins:{legend:{display:false}}
  });
}
function zonaCardHtml(zona, recZ){
  const byCiudad = aggBy(recZ, r=>r[2]);
  const rows = [...byCiudad.entries()].map(([idx,o])=>({ciudad:CIUDAD[idx],plan:o.plan,real:o.real,eff:o.real/o.plan}))
    .sort((a,b)=>b.plan-a.plan).slice(0,4);
  const totPlan = recZ.length, totReal = recZ.reduce((a,r)=>a+r[6],0);
  const label = 'ZONA '+(zona==='CENTRAL'?'CENTRO':zona);
  return `<div class="tw">
    <div class="tw-title">${label}</div>
    <table><thead><tr><th>Ciudad</th><th class="num">Visitas</th><th class="num">Visitas realizadas</th><th class="num">Productividad</th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr><td>${toTitle(r.ciudad)}</td><td class="num">${num(r.plan)}</td><td class="num">${num(r.real)}</td><td class="num">${pct0(r.eff)}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="num">${num(totPlan)}</td><td class="num">${num(totReal)}</td><td class="num">${pct0(totReal/totPlan)}</td></tr>
    </tbody></table>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// COLABORADORES
// ═══════════════════════════════════════════════════════════
let colabSort={key:'Productividad',dir:-1};
let colabSearch='';
function pgColaboradores(){
  document.getElementById('content').innerHTML = `
  <div class="fbar">
    <span class="fbar-label"><i class="fas fa-search"></i></span>
    <input class="fsearch" id="f-search" placeholder="Buscar colaborador..." oninput="onColabSearch(this.value)">
    <div style="margin-left:auto;font-size:11px;color:var(--tx3)" id="colab-count"></div>
  </div>
  <div class="tw">
    <div class="tw-title">Visitas por colaborador</div>
    <table>
      <thead><tr>
        <th onclick="sortColab('Colaborador')">Colaborador<span class="sort-ico">⇅</span></th>
        <th class="num" onclick="sortColab('Planificadas')">Ruteo planificado<span class="sort-ico">⇅</span></th>
        <th class="num" onclick="sortColab('EnRuta')">Visitas en ruta<span class="sort-ico">⇅</span></th>
        <th class="num" onclick="sortColab('FueraRuta')">Visitas fuera itinerario<span class="sort-ico">⇅</span></th>
        <th class="num" onclick="sortColab('Total')">Total realizadas<span class="sort-ico">⇅</span></th>
        <th class="num" onclick="sortColab('Productividad')">% Productividad<span class="sort-ico">⇅</span></th>
      </tr></thead>
      <tbody id="tb-colab"></tbody>
    </table>
  </div>
  `;
  document.getElementById('f-search').value = colabSearch;
  renderColabTable();
}
function onColabSearch(v){ colabSearch=v.toLowerCase(); renderColabTable(); }
function sortColab(key){
  if(colabSort.key===key) colabSort.dir*=-1; else colabSort={key,dir:-1};
  renderColabTable();
}
function renderColabTable(){
  const records = getRecords();
  const byColab = aggBy(records, r=>r[0]);
  let rows = [...byColab.entries()].map(([idx,o])=>({
    Colaborador: COLAB[idx], Planificadas:o.plan, FueraRuta:o.fueraReal, EnRuta:o.real-o.fueraReal,
    Total:o.real, Productividad: o.plan? o.real/o.plan : 0
  }));
  if(colabSearch) rows = rows.filter(c=>c.Colaborador.toLowerCase().includes(colabSearch));
  rows.sort((a,b)=>{
    const k=colabSort.key; let av=a[k], bv=b[k];
    if(typeof av==='string'){ av=av.toLowerCase(); bv=bv.toLowerCase(); return av<bv?-colabSort.dir:av>bv?colabSort.dir:0; }
    return (av-bv)*colabSort.dir;
  });
  document.getElementById('colab-count').textContent = rows.length+' colaboradores';
  if(!rows.length){ document.getElementById('tb-colab').innerHTML = `<tr><td colspan="6" class="empty-note">Sin datos para este filtro.</td></tr>`; return; }
  const totPlan = rows.reduce((a,c)=>a+c.Planificadas,0);
  const totEnRuta = rows.reduce((a,c)=>a+c.EnRuta,0);
  const totFuera = rows.reduce((a,c)=>a+c.FueraRuta,0);
  const totTotal = rows.reduce((a,c)=>a+c.Total,0);
  document.getElementById('tb-colab').innerHTML = rows.map(c=>`
    <tr><td>${toTitle(c.Colaborador)}</td><td class="num">${num(c.Planificadas)}</td><td class="num">${num(c.EnRuta)}</td>
    <td class="num">${num(c.FueraRuta)}</td><td class="num">${num(c.Total)}</td>
    <td class="num"><span class="pct-badge" style="background:${effColor(c.Productividad)}">${pct0(c.Productividad)}</span></td></tr>`).join('')
    + `<tr class="tot"><td>Total</td><td class="num">${num(totPlan)}</td><td class="num">${num(totEnRuta)}</td><td class="num">${num(totFuera)}</td><td class="num">${num(totTotal)}</td>
    <td class="num"><span class="pct-badge" style="background:${effColor(totTotal/totPlan)}">${pct0(totTotal/totPlan)}</span></td></tr>`;
}

// ═══════════════════════════════════════════════════════════
// RUTA EFECTIVA POR DÍA (heatmap) — usa el filtro global de mes
// ═══════════════════════════════════════════════════════════
let rutaSearch='';
function pgRuta(){
  if(FILT.mes==='all'){
    document.getElementById('content').innerHTML = `
    <div class="empty-note"><i class="fas fa-calendar-day" style="font-size:22px;display:block;margin-bottom:10px"></i>
    Elegí un mes en el filtro superior para ver el detalle día por día.</div>`;
    return;
  }
  document.getElementById('content').innerHTML = `
  <div class="fbar">
    <span class="fbar-label"><i class="fas fa-search"></i></span>
    <input class="fsearch" id="f-search-ruta" placeholder="Buscar colaborador..." oninput="onRutaSearch(this.value)">
  </div>
  <div class="tw">
    <div class="tw-title">Ruta efectiva por día — ${MES_NOMBRES[FILT.mes]} 2026</div>
    <div class="heat-wrap"><table id="heat-table"></table></div>
  </div>
  `;
  document.getElementById('f-search-ruta').value = rutaSearch;
  renderHeat();
}
function onRutaSearch(v){ rutaSearch=v.toLowerCase(); renderHeat(); }
function renderHeat(){
  const mes = parseInt(FILT.mes);
  const records = getRecords();
  const nd = mes===9 ? 7 : new Date(2026,mes,0).getDate();
  const days = Array.from({length:nd},(_,i)=>i+1);

  const idx = {}; // colabIdx -> {day: {plan,real}}
  for(const r of records){
    const day = r[1]%100;
    idx[r[0]] = idx[r[0]] || {};
    idx[r[0]][day] = idx[r[0]][day] || {plan:0,real:0};
    idx[r[0]][day].plan++;
    if(r[6]) idx[r[0]][day].real++;
  }
  let colabIdxs = Object.keys(idx).map(Number);
  if(rutaSearch) colabIdxs = colabIdxs.filter(i=>COLAB[i].toLowerCase().includes(rutaSearch));
  colabIdxs.sort((a,b)=>COLAB[a]<COLAB[b]?-1:1);

  if(!colabIdxs.length){
    document.getElementById('heat-table').innerHTML = `<tr><td class="empty-note">Sin datos para este filtro.</td></tr>`;
    return;
  }

  let thead = '<thead><tr><th>Colaborador</th>' + days.map(d=>`<th style="text-align:center">${String(d).padStart(2,'0')}/${String(mes).padStart(2,'0')}</th>`).join('') + '</tr></thead>';
  let body = '<tbody>';
  const dayTotals = days.map(()=>({plan:0,real:0}));
  for(const ci of colabIdxs){
    body += `<tr><td class="heat-name">${toTitle(COLAB[ci])}</td>`;
    days.forEach((d,i)=>{
      const cell = idx[ci][d];
      if(!cell){ body += '<td></td>'; return; }
      dayTotals[i].plan += cell.plan; dayTotals[i].real += cell.real;
      const effv = cell.real/cell.plan;
      body += `<td class="heat-cell" style="background:${effColor(effv)}">${pct0(effv)}</td>`;
    });
    body += '</tr>';
  }
  body += `<tr class="tot"><td>Total</td>` + dayTotals.map(dt=>{
    if(!dt.plan) return '<td></td>';
    const effv = dt.real/dt.plan;
    return `<td class="heat-cell" style="background:${effColor(effv)};color:var(--tx)">${pct0(effv)}</td>`;
  }).join('') + '</tr>';
  body += '</tbody>';

  document.getElementById('heat-table').innerHTML = thead + body;
}

// ═══════════════════════════════════════════════════════════
// GEOGRAFÍA
// ═══════════════════════════════════════════════════════════
function pgGeografia(){
  const records = getRecords();
  if(!records.length){
    document.getElementById('content').innerHTML = `<div class="empty-note">Sin datos para este filtro.</div>`;
    return;
  }
  const byCiudad = aggBy(records, r=>r[2]);
  const ciu = [...byCiudad.entries()].map(([idx,o])=>({ciudad:CIUDAD[idx],region:null,plan:o.plan,real:o.real,eff:o.real/o.plan}));
  // resolver región de cada ciudad (tomamos la región más frecuente entre sus registros)
  const ciudadRegion = {};
  for(const r of records){ ciudadRegion[r[2]] = r[3]; }
  ciu.forEach(c=>{ const idx=CIUDAD.indexOf(c.ciudad); c.region = REGION[ciudadRegion[idx]]; });
  ciu.sort((a,b)=>b.plan-a.plan);

  const byRegion = aggBy(records, r=>r[3]);
  const reg = [...byRegion.entries()].map(([idx,o])=>({region:REGION[idx],plan:o.plan,real:o.real,eff:o.real/o.plan})).sort((a,b)=>b.plan-a.plan);

  const byZona = aggBy(records, r=>r[4]);
  const zonaRows = [...byZona.entries()].map(([idx,o])=>({zona:ZONA[idx],plan:o.plan,real:o.real,eff:o.real/o.plan}))
    .filter(z=>z.zona!=='Sin dato de cobertura').sort((a,b)=>b.plan-a.plan);

  document.getElementById('content').innerHTML = `
  <div class="kpi-grid">
    ${zonaRows.map(z=>`<div class="kpi-box n"><div class="v">${pct0(z.eff)}</div><div class="l">Zona ${toTitle(z.zona)} · ${num(z.real)}/${num(z.plan)}</div></div>`).join('') || '<div class="empty-note">Sin datos de zona.</div>'}
  </div>

  <div class="grid-2 stretch" style="grid-template-columns:1.4fr 1fr">
    <div class="col"><div class="card card-p">
      <div class="card-title">Efectividad por ciudad</div>
      <div class="chart-h-lg"><canvas id="ch-ciu2"></canvas></div>
    </div></div>
    <div class="col"><div class="card card-p">
      <div class="card-title">Por región</div>
      <div class="chart-h-lg"><canvas id="ch-reg2"></canvas></div>
    </div></div>
  </div>

  <div class="tw">
    <div class="tw-title">Detalle por ciudad</div>
    <table><thead><tr><th>Ciudad</th><th>Región</th><th class="num">Planificadas</th><th class="num">Realizadas</th><th class="num">Efectividad</th></tr></thead>
    <tbody>${ciu.map(c=>`<tr><td>${toTitle(c.ciudad)}</td><td>${toTitle(c.region)}</td><td class="num">${num(c.plan)}</td><td class="num">${num(c.real)}</td>
      <td class="num"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
        <div class="eff-bar"><div class="eff-fill" style="width:${Math.min(c.eff*100,100)}%;background:${effColor(c.eff)}"></div></div>
        <span style="font-weight:700;min-width:42px">${pct(c.eff)}</span>
      </div></td></tr>`).join('')}</tbody></table>
  </div>
  `;

  const ciuSorted = [...ciu].sort((a,b)=>b.eff-a.eff);
  mkC('ch-ciu2','bar',{
    labels: ciuSorted.map(c=>toTitle(c.ciudad)),
    datasets:[{data:ciuSorted.map(c=>Math.round(c.eff*100)),backgroundColor:ciuSorted.map((c,i)=>PALETTE[i%PALETTE.length]),borderRadius:3}]
  },{
    indexAxis:'y',
    scales:{x:{min:0,max:100,ticks:{color:tc(),callback:v=>v+'%'},grid:{color:tg()}},y:{ticks:{color:tc(),font:{size:10}},grid:{display:false}}},
    plugins:{legend:{display:false}}
  });

  mkC('ch-reg2','doughnut',{
    labels: reg.map(r=>toTitle(r.region)),
    datasets:[{data:reg.map(r=>r.real),backgroundColor:PALETTE.concat(['#7a8ca8','#d4738f','#5ac9d8'])}]
  },{
    plugins:{legend:{position:'bottom',labels:{color:tc(),boxWidth:10,font:{size:9.5},padding:8}}}
  });
}

// ═══════════════════════════════════════════════════════════
// MAPA DE COBERTURA
// ═══════════════════════════════════════════════════════════
function pgMapa(){
  destroyMap();
  const records = getRecords();
  if(!records.length){
    document.getElementById('content').innerHTML = `<div class="empty-note">Sin datos para este filtro.</div>`;
    return;
  }
  const byCiudad = aggBy(records, r=>r[2]);
  const puntos = [];
  for(const [idx,o] of byCiudad.entries()){
    const ciudad = CIUDAD[idx];
    const coords = CIUDAD_COORDS[ciudad];
    if(!coords) continue;
    const zonaCount = {};
    for(const r of records){ if(r[2]===idx){ const z=ZONA[r[4]]; zonaCount[z]=(zonaCount[z]||0)+1; } }
    const zona = Object.entries(zonaCount).sort((a,b)=>b[1]-a[1])[0][0];
    puntos.push({ciudad, coords, zona, plan:o.plan, real:o.real, eff:o.real/o.plan});
  }
  const zonasPresentes = [...new Set(puntos.map(p=>p.zona))].filter(z=>ZONA_COLOR[z]);

  document.getElementById('content').innerHTML = `
  <div class="tw">
    <div class="tw-title">Mapa de cobertura — ${puntos.length} ciudades</div>
    <div style="padding:22px">
      <div class="map-wrap">
        <div id="map-cobertura"></div>
        <div class="map-legend">
          <div class="lt">Zona de cobertura</div>
          ${zonasPresentes.map(z=>`<div class="li"><span class="dot" style="background:${ZONA_COLOR[z]}"></span>${toTitle(z==='CENTRAL'?'Zona Centro':'Zona '+z)}</div>`).join('')}
          <div class="li" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)"><span style="font-size:10px;color:var(--tx3)">Tamaño del círculo = volumen de visitas</span></div>
        </div>
      </div>
    </div>
  </div>
  `;

  leafletMap = L.map('map-cobertura', {scrollWheelZoom:false}).setView([-25.7,-55.6], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap',
    maxZoom:12
  }).addTo(leafletMap);

  const maxPlan = Math.max(...puntos.map(p=>p.plan));
  puntos.forEach(p=>{
    const color = ZONA_COLOR[p.zona] || '#8a8580';
    const radius = 6 + Math.sqrt(p.plan/maxPlan)*22;
    L.circleMarker(p.coords, {
      radius, color, weight:2, fillColor:color, fillOpacity:.45
    }).addTo(leafletMap).bindPopup(
      `<b>${toTitle(p.ciudad)}</b><br>Zona: ${toTitle(p.zona==='CENTRAL'?'Centro':p.zona)}<br>`+
      `Planificadas: ${num(p.plan)}<br>Realizadas: ${num(p.real)}<br>Efectividad: <b>${pct0(p.eff)}</b>`
    );
  });
}


initFilterBar();
render();
</script>
